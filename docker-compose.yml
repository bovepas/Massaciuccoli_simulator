services:
  massaciuccoli_app:
    build:
      context: ./app
      dockerfile: Dockerfile

    container_name: massaciuccoli_app

    stdin_open: true
    tty: true

    volumes:
      - ./app:/app

    env_file:
      - LLM.env

    depends_on:
      ollama-init:
        condition: service_completed_successfully

    command: python -m versions.v6_1_orchestrator


  ollama:
    image: ollama/ollama:latest
    pull_policy: always

    container_name: ollama

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    restart: unless-stopped

    gpus: all

    healthcheck:
      disable: true


  ollama-init:
    image: ollama/ollama:latest
    pull_policy: always

    depends_on:
      - ollama

    environment:
      OLLAMA_HOST: http://ollama:11434

    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "Waiting for Ollama API..."
        until ollama list >/dev/null 2>&1; do
          sleep 3
        done
        echo "Ensuring qwen3.5:9b is available..."
        ollama pull qwen3.5:9b
        echo "Qwen is ready."

        echo "Ensuring gemma4:12b is available..."
        ollama pull gemma4:12b
        echo "Gemma 4 12B is ready."

    restart: "no"


volumes:
  ollama_data:
